replicaCount: 2

image:
  repository: ameenser/weather-app
  tag: main-5f885fc
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub-secret

appEnv: staging

containerPort: 8000

service:
  name: weather-app-nodeport
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30081

changeBackgroundColor: "true"

monitoring:
  alertmanagerConfig:
    enabled: true
  prometheusRule:
    enabled: true
