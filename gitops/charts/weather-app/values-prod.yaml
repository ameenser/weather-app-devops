replicaCount: 1

image:
  repository: ameenser/weather-app
  tag: 1.0.11
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub-secret

appEnv: production

containerPort: 8000

service:
  name: weather-app-nodeport
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30082

changeBackgroundColor: "false"

monitoring:
  alertmanagerConfig:
    enabled: true
  prometheusRule:
    enabled: true

