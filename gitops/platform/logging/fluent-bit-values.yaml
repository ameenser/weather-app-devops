kind: DaemonSet

flush: 1
logLevel: info

serviceAccount:
  create: true

rbac:
  create: true

envFrom:
  - secretRef:
      name: fluent-bit-make-webhook

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

tolerations:
  - operator: Exists

luaScripts:
  add_http_headers.lua: |
    function add_http_headers(tag, timestamp, record)
      record["http_headers"] = {
        ["Content-Type"] = "application/json"
      }
      return 1, timestamp, record
    end

config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*_wa-staging_weather-app-*.log
        multiline.parser  docker, cri
        Tag               kube.*
        DB                /var/log/flb_weather_app.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Read_from_Head    Off

  filters: |

    [FILTER]
        Name              lua
        Match             kube.*
        Script            /fluent-bit/scripts/add_http_headers.lua
        Call              add_http_headers

    [FILTER]
        Name              kubernetes
        Match             kube.*
        Kube_Tag_Prefix   kube.var.log.containers.
        Merge_Log         On
        Merge_Log_Trim    On
        Keep_Log          On
        Labels            On
        Annotations       Off

    [FILTER]
        Name              grep
        Match             kube.*
        Logical_Op        AND
        Regex             $kubernetes['namespace_name'] ^wa-staging$
        Regex             $kubernetes['container_name'] ^weather-app$
        Regex             level ^(ERROR|CRITICAL)$

  outputs: |
    [OUTPUT]
        Name                  http
        Match                 kube.*
        Host                  ${MAKE_WEBHOOK_HOST}
        Port                  443
        URI                   ${MAKE_WEBHOOK_URI}
        TLS                   On
        TLS.Verify            On
        HTTP_Method           POST
        Format                json
        Headers_Key           $http_headers
        Body_Key              $log
        Retry_Limit           5
        Log_Response_Payload  On
