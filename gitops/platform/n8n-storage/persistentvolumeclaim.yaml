apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n
  namespace: n8n
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: argocd

spec:
