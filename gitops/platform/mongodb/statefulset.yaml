apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: mongodb-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  serviceName: mongodb-headless
  replicas: 3
  podManagementPolicy: Parallel

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      terminationGracePeriodSeconds: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: mongodb
                topologyKey: kubernetes.io/hostname

      containers:
        - name: mongodb
          image: mongo:7.0.40

          command:
            - mongod

          args:
            - --replSet
            - rs0
            - --bind_ip_all

          ports:
            - name: mongodb
              containerPort: 27017

          volumeMounts:
            - name: mongo-data
              mountPath: /data/db

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: gp3

        resources:
          requests:
            storage: 2Gi
