apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: mongodb-replica-set
  namespace: argocd

spec:
  project: default

  source:
    repoURL: http://gitlab.weather-app-as.com/ameenser/weather-app-gitops.git
    targetRevision: main
    path: platform/mongodb

  destination:
    server: https://kubernetes.default.svc
    namespace: mongodb-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
