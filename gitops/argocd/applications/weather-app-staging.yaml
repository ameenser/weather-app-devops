apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: weather-app-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: http://gitlab.weather-app-as.com/ameenser/weather-app-gitops.git
    targetRevision: main
    path: charts/weather-app

    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: wa-staging

  # Staging is automatically synchronized from Git.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
