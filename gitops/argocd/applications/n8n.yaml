apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: n8n
  namespace: argocd

spec:
  project: default

  sources:
    # Official n8n Helm chart from the OCI registry.
    - repoURL: oci://ghcr.io/n8n-io/n8n-helm-chart/n8n
      targetRevision: 1.11.0
      path: .

      helm:
        releaseName: n8n
        valueFiles:
          - $values/platform/n8n/values.yaml

    # Our GitOps repository containing values.yaml.
    - repoURL: http://gitlab.weather-app-as.com/ameenser/weather-app-gitops.git
      targetRevision: main
      ref: values


    - repoURL: http://gitlab.weather-app-as.com/ameenser/weather-app-gitops.git
      targetRevision: main
      path: platform/n8n-storage

  destination:
    server: https://kubernetes.default.svc
    namespace: n8n

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
