replicaCount: 2

image:
  repository: ameenser/weather-app
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: dockerhub-secret

containerPort: 8000

service:
  name: weather-app-nodeport
  type: NodePort
  port: 80
  targetPort: 8000
  nodePort: 30080

changeBackgroundColor: "true"

serviceAccount:
  create: true
  name: weather-app

vault:
  enabled: false
  role: ""
  secretPath: ""
  template: ""
