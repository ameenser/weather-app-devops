apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: weather-ci
spec:
  serviceAccountName: jenkins
  restartPolicy: Never

  containers:
    - name: python
      image: python:3.12-slim
      command:
        - cat
      tty: true
      workingDir: /home/jenkins/agent
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"

    - name: docker
      image: docker:27-cli
      command:
        - cat
      tty: true
      workingDir: /home/jenkins/agent
      env:
        - name: DOCKER_HOST
          value: tcp://localhost:2375
        - name: DOCKER_TLS_CERTDIR
          value: ""
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"

    - name: dind
      image: docker:27-dind
      securityContext:
        privileged: true
      env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      args:
        - --host=tcp://0.0.0.0:2375
        - --tls=false
      volumeMounts:
        - name: docker-graph-storage
          mountPath: /var/lib/docker
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2000m"
          memory: "3Gi"
          
    - name: kubectl
      image: dtzar/helm-kubectl:latest
      command:
        - cat
      tty: true
      workingDir: /home/jenkins/agent
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
  volumes:
    - name: docker-graph-storage
      emptyDir: {}
